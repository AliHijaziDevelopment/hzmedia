services:
  api:
    build:
      context: .
      target: api
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:4001:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - ./.env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api
    restart: unless-stopped
